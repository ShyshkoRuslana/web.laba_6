<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Реєстрація на курс</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>
<div class="weather-card-wrapper">
    <!-- Кнопки навігації зі стрілками (прозорі) -->
    <div class="nav-buttons">
        <span class="nav-arrow">&larr;</span>
        <span class="nav-arrow">&rarr;</span>
    </div>

    <!-- Головна чорна картка -->
    <div class="main-card">
        <div class="main-temp">17</div>
    </div>

    <!-- Зображення хмари, що виходить за межі чорного блоку -->
    <img class="cloud-img" src="https://png.pngtree.com/png-clipart/20230413/original/pngtree-3d-cloud-weather-sky-png-image_9050960.png" alt="Cloud">

    <!-- Нижній світлий блок з днями тижня -->
    <div class="forecast-card">
        <div class="forecast-grid">
            <div class="day-item">
                <span class="day-name">Mon</span>
                <span class="day-temp">17°</span>
            </div>
            <div class="day-item">
                <span class="day-name">Tue</span>
                <span class="day-temp">19°</span>
            </div>
            <div class="day-item">
                <span class="day-name">Wed</span>
                <span class="day-temp">16°</span>
            </div>
            <div class="day-item">
                <span class="day-name">Thu</span>
                <span class="day-temp">18°</span>
            </div>
            <div class="day-item">
                <span class="day-name">Fri</span>
                <span class="day-temp">21°</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
